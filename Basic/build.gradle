android {
    namespace 'com.letter.basic'
    compileSdk 35

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    //启用viewBinding
    buildFeatures {
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

// detekt — Kotlin 静态分析，仅启用注释检查规则
detekt {
    config = rootProject.files('.detekt.yml')
    // 不使用默认规则集，只加载 .detekt.yml 中启用的注释规则
    buildUponDefaultConfig = false
}

// Checkstyle — Java 静态分析，仅启用 Javadoc 规则
checkstyle {
    toolVersion = "10.21.2"
    configFile = rootProject.file('checkstyle.xml')
}

// Android 项目需显式创建 Checkstyle task（Gradle 默认不会为 Android 源集创建）
tasks.register('checkstyleMain', Checkstyle) {
    description = '检查 Java Javadoc 注释'
    source = android.sourceSets.main.java.srcDirs
    include '**/*.java'
    classpath = files()
    reports {
        xml.required.set(true)
        xml.outputLocation.set(layout.buildDirectory.file('reports/checkstyle/main.xml'))
    }
}

// 自定义 task：注释检查（供 android-code-review Section E 调用）
// 用法：./gradlew :Basic:checkComments -Pscope=full|staged
tasks.register('checkComments') {
    group = 'verification'
    description = '检查 KDoc/Javadoc 注释缺失（scope=full|staged）'

    // 依赖 detekt 和 checkstyle 的检测 task，确保报告已生成
    // 注意：detekt 和 checkstyleMain 可能因发现违规而失败，但我们需要它们的报告
    def detektTask = tasks.findByName('detekt')
    def checkstyleTask = tasks.findByName('checkstyleMain')
    if (detektTask != null) {
        dependsOn detektTask
        // 仅报告不阻塞构建，Section E 由 android-code-review skill 决定是否阻塞
        detektTask.ignoreFailures = true
    }
    if (checkstyleTask != null) {
        dependsOn checkstyleTask
        checkstyleTask.ignoreFailures = true
    }

    doLast {
        def scope = project.findProperty('scope') ?: 'staged'

        // 收集 scope 范围内的文件路径（用于结果过滤）
        def scopedFileSet = null
        if (scope == 'staged') {
            def process = "git diff --cached --name-only".execute([], project.rootDir)
            process.waitFor()
            scopedFileSet = process.text.readLines()*.trim().findAll { it }
                    .collect { project.rootDir.toPath().resolve(it).toFile().canonicalPath }
                    .toSet()
        }

        def detektIssues = []
        def checkstyleIssues = []

        // 解析 detekt XML 报告
        def detektReportDir = layout.buildDirectory.dir('reports/detekt').get().asFile
        def detektXml = new File(detektReportDir, 'detekt.xml')
        if (detektXml.exists()) {
            def detektReport = new groovy.xml.XmlSlurper().parse(detektXml)
            detektReport.file.each { fileNode ->
                def filePath = fileNode.@name.text()
                if (scopedFileSet != null && !scopedFileSet.contains(new File(filePath).canonicalPath)) return
                fileNode.error.each { errorNode ->
                    // 排除 override 方法（detekt 不支持配置级排除）
                    def rule = errorNode.@source.text()
                    def lineNum = errorNode.@line.toInteger()
                    if (rule.contains('UndocumentedPublicFunction')) {
                        def srcFile = new File(filePath)
                        if (srcFile.exists()) {
                            def srcLine = srcFile.readLines()[lineNum - 1]
                            if (srcLine =~ /override\s+fun/) return
                        }
                    }
                    detektIssues << [
                        file: filePath,
                        line: errorNode.@line.toInteger(),
                        rule: errorNode.@source.text(),
                        message: errorNode.@message.text()
                    ]
                }
            }
        }

        // 解析 Checkstyle XML 报告
        def checkstyleReportDir = layout.buildDirectory.dir('reports/checkstyle').get().asFile
        def checkstyleXml = new File(checkstyleReportDir, 'main.xml')
        if (checkstyleXml.exists()) {
            def checkstyleReport = new groovy.xml.XmlSlurper().parse(checkstyleXml)
            checkstyleReport.file.each { fileNode ->
                def filePath = fileNode.@name.text()
                if (scopedFileSet != null && !scopedFileSet.contains(new File(filePath).canonicalPath)) return
                fileNode.error.each { errorNode ->
                    def msg = errorNode.@message.text()
                    def category
                    if (msg.contains('variable')) category = 'E3'
                    else if (msg.contains('method')) category = 'E2'
                    else category = 'E1'
                    checkstyleIssues << [
                        file: filePath,
                        line: errorNode.@line.toInteger(),
                        rule: errorNode.@source.text(),
                        message: msg,
                        category: category
                    ]
                }
            }
        }

        // 输出 JSON 报告
        def commentsReportDir = layout.buildDirectory.dir('reports/comments').get().asFile
        commentsReportDir.mkdirs()
        def result = [
            scope: scope,
            detekt: detektIssues,
            checkstyle: checkstyleIssues,
            summary: [
                total: detektIssues.size() + checkstyleIssues.size(),
                kotlin: detektIssues.size(),
                java: checkstyleIssues.size()
            ]
        ]
        def outputFile = new File(commentsReportDir, 'check-comments.json')
        outputFile.text = new groovy.json.JsonBuilder(result).toPrettyString()
        println "注释检查完成：${detektIssues.size()} Kotlin + ${checkstyleIssues.size()} Java → ${outputFile.absolutePath}"
    }
}

